<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1> Ordered List</h1>
    <ol type="I">
        <li> HTML</li>
        <li> CSS</li>
        <li> Java</li>
    </ol>
    <ol type="1">
        <li>HTML</li>
        <li> CSS</li>
        <li> Java</li>
    </ol>
    
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>Java</li>
        </ol>

        <ol type="a">
            <li>HTML</li>
            <li>CSS</li>
            <li> Java</li>
        </ol>
    <ol type="i">
        <li> HTML</li>
        <li> CSS</li>
        <li> Java</li>
    </ol>
    <br>
    <h2> Unordered list</h2>
    <ul type="circle">
        <li> HTML</li>
        <li> CSS</li>
        <li> Java</li>
    </ul>
    <ul type="square">
        <li>HTML</li>
        <li>CSS</li>
        <li>Java</li>
    </ul>

</body>
</html>
