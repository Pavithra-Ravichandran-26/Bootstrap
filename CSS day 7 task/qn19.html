<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex End</title>
    <style>
        .container {
            display: flex;
            align-items: center;
            height: 200px;
            border: 2px solid black;
            padding: 10px;
            gap: 10px;
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid blue;
            text-align: center;
            line-height: 100px;
            font-weight: bold;
        }
        .different{
            align-self: flex-end;
            background-color: lightgreen;
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box different">Box 2</div>
        <div class="box">Box 3</div>
    </div>
</body>
</html>
