<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Card Using Flexbox</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color:lightskyblue;
        }

        .card {
            width: 250px;
            height: 150px;
            background-color: lightblue;
            border: 2px solid blue;
            border-radius: 10px;
            text-align: center;
            line-height: 150px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        Welcome
    </div>

</body>
</html>
