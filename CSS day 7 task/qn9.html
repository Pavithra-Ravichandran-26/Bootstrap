<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Content</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            width: 350px;
            height: 300px;
            border: 2px solid black;
            gap: 10px;
            padding: 10px;
        }

        .box {
            width: 100px;
            height: 60px;
            background-color: lightblue;
            border: 2px solid blue;
            text-align: center;
            line-height: 60px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

</body>
</html>
