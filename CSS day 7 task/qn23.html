<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Flex Container </title>

    <style>
        .outer-container {
            display: flex;
            gap: 20px;
            border: 2px solid black;
            padding: 20px;
        }

        .sidebar {
            width: 150px;
            background-color: lightgray;
            padding: 20px;
            text-align: center;
            border: 2px solid gray;
        }

        .content {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 15px;
            border: 2px solid blue;
            padding: 20px;
        }

        .box {
            background-color: lightblue;
            border: 2px solid blue;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="outer-container">

    <div class="sidebar">
        Sidebar
    </div>

    <div class="content">

        <div class="box">Header</div>

        <div class="box">Main Content</div>

        <div class="box">Footer</div>

    </div>

</div>

</body>
</html>
