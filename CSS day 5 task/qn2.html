<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rounded corners</title>
     <style>
        button {
            background-color: royalblue;
            color: white;
            padding: 10px;
            border-radius: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <button>Click Me</button>

</body>
</html>
</body>
</html>
