<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box shadow and border radius</title>
    <style>
        .card {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            background-color: green;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 1);
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>VTS</h2>
        <p>VTS is a leading IT training and development company focused on practical learning.</p>
    </div>

</body>
</html>
</body>
</html>
