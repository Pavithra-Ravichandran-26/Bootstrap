<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadowed heading</title>
    <style>
        h1 {
            color: black;
            text-shadow: 2px 2px 4px gray;
        }

        h1:hover {
            color: blue;
        }
    </style>
</head>
<body>

    <h1>Happy Morning</h1>

</body>
</html> 
</body>
</html>
