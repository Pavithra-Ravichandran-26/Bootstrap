<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scrollable content box</title>
    <style>
    .scroll-box{
    width:300px;
    height:150px;
    border:2px solid black;
    padding:10px;
    overflow-y:auto;
    }
</style>
</head>
<body>

<div class="scroll-box">
    <p>HTML</p>
    <p>CSS</p>
    <p>Javascript</p>
    <p>Database</p>
    <p>Devops</p>
    <p>Phython</p>

</body>
</html>
</body>
</html>
