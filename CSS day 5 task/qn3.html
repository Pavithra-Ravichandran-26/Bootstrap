<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow box</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            margin: 50px auto;
            background-color:violet;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>lifted shadow</h2>
        <p>A lifted shadow means the shadow makes the element look like it is slightly raised above the page, just like a physical card lying on a table.</p>
    </div>

</body>
</html>
</body>
</html>
