<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border-radius and box-shadow</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            margin: 50px auto;
            background-color:lavender;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>CSS</h2>
        <p>Cascading style sheet</p>
    </div>

</body>
</html>
</body>
</html>
