<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text shadow</title>
    <style>
        .banner {
            background-color: #1e90ff;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: white;
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="banner">
        <h1>The Taste Of Joy</h1>
    </div>

</body>
</html>
</body>
</html>
