<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <h1>Job Application Form</h1><br>
    <form>
        <lable>Applicant Name:</lable><br>
        <input type="text" placeholder="Name" required><br><br>
        <lable>Email:</lable><br>
        <input type="email" placeholder="Email" required><br><br>
        <label>Mobile Number:</label><br>
        <input type="number" placeholder="Number"><br><br>
        <lable>Date Of Birth:</lable><br>
        <input type="date"><br><br>
        <label>Gender</label><br>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other <br><br>
        <lable>Qualtification:</lable><br>
        <select>
            <option>Select Qualification</option>
            <option>UG Degree</option>
            <option>PG Degree</option>
        </select><br><br>
        <lable>Experience:</lable><br>
        <input type="number" placeholder="years of experience" name="number" min="0"><br><br>
        <label>Skills</label>
        <textarea rows="8" cols="8" placeholder="skills"></textarea><br><br>
        <label>Resume Upload:</label>
        <input type="file" placeholder="Upload File"><br><br>
        <lable>Preffered Location:</lable>
        <select>
            <option>Select Location</option>
            <option>Chennai</option>
            <option>Bangalore</option>
            <option>Hydrabad</option>
            <option>Mumbai</option>
        </select><br><br>
        <button>Submit</button>



    </form>
    
</body>
</html>
