<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vmax</title>
    <style>
        .container{
            background-color: aqua;
            color: black;
            padding: 5vmax;
            border: 20px solid blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vmax CSS</h1>
        <p>In CSS, vmax stands for Viewport Maximum. It is a relative length unit equal to 1% of the viewport’s larger dimension</p>

    </div>
    
</body>
</html>
