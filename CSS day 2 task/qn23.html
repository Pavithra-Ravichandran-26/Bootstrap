<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSL Hover effect</title>
     <style>
     nav ul li {
            color: hsl(210, 100%, 40%);
         }

        nav ul li:hover {
           color: hsl(30, 100%, 50%);
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </nav>

</body>
</html>
    
</body>
</html>
