<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conic gradient</title>
    <style>
        button{
            background:conic-gradient(red,blue,yellow,green);
            padding: 20px;
            color: black;
        }
        button:hover{
            background:conic-gradient(from 180deg, red,blue,yellow,green)
        }
    </style>
</head>
<body>
    <button>Click Me</button>
    
</body>
</html>
