<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Color Wheel Button</title>
    <style>
        .color-wheel {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            color:black;
            font-size: 18px;
            cursor: pointer;
            background: conic-gradient(red, yellow, green, blue, red);
            transition: 0.5s;
        }

        .color-wheel:hover {
            background: conic-gradient(from 180deg, red, yellow, green, blue, red);
        }
    </style>
</head>
<body>

    <button class="color-wheel">Cllick me</button>

</body>
