<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial gradient background</title>
    <style>
        .card {
            background: radial-gradient(circle, lightyellow, orange);
            padding: 20px;
            width: 300px;
            border: 2px solid black;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>CSS Radial gradient</h2>
        <p>The CSS radial-gradient() function creates an image consisting of a progressive transition between two or more colors that radiate outward from a central origin</p>
    </div>

</body>
</html>
</body>
</html>
