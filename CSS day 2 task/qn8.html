<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vmin</title>
    <style>
        h1{
            font-size: 5Vmin;
            text-align: center;
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Vmin CSS</h1>
    <p>In CSS, vmin is a responsive viewport unit equal to 1% of the browser window's smaller dimension</p>
    
</body>
</html>
