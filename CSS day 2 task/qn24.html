<head>

    <title>repeating-linear-gradient</title>
    <style>
        body {
            background: repeating-linear-gradient(
                45deg,
                lightblue 0px,
                lightblue 20px,
                white 20px,
                white 40px);
        }
    </style>
</head>
<body>
 <header>
        <h1>CSS Colors </h1> </header>
    <p>
        <ol>
            <li>Named color</li>
            <li>Hexadecimal color</li>
            <li>RGB & RGBA</li>
            <li>HSL & HSLA</li>
            </ol>
            </p>
</body>
</html>
