<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conic gradient</title>
    <style>
        section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
        }

        .progress-ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(
                green 0deg 270deg,
                lightgray 270deg 360deg );
        }
    </style>
</head>
<body>

    <section>
        <div class="progress-ring"></div>
    </section>

</body>
</html>
</body>
</html>
