<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiple color gradient</title>
    <style>
        footer {
            background: radial-gradient(
                circle,
                yellow 10%,
                orange 30%,
                pink 60%,
                purple 100%
            );
            color:black;
            text-align: center;
            padding: 30px;
        }
    </style>
</head>
<body>

    <footer>
        <h2>CSS Radial gradient</h2>
        <p>The CSS radial-gradient() function creates an image consisting of a progressive transition between two or more colors that radiate outward from a central origin</p>
    </footer>

</body>
</html>
    
</body>
</html>
