<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding and Margin</title>
    <style>
        div{
            margin: 30px;
            padding: 20px;
            border: 2px solid blue;
            background-color: aqua;
            color: black;
        }
    </style>
</head>
<body>
    <div>
        In web design and CSS, padding creates space inside an element between the content and the border. Margin creates space outside the element, pushing other elements away or creating gaps between neighboring boxes
    </div>
    
</body>
</html>
