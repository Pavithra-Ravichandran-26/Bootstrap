<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Top Example</title>
    <style>
        section {
            width: 400px;
            margin-top: 100px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            border: 2px solid blue;
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <section>
        <h2>Margin Top</h2>
        <p>The margin-top property in CSS sets the clear area (margin) required on the top of an element.</p>
    </section>

</body>
</html>
</body>
</html>
