<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin auto</title>
    <style>
        section{
            width: 500px;
            margin:auto;
            padding: 10px;
            background-color: lightseagreen;
            color: black;
            text-align: center;
        }
    </style>
</head>
<body>
    <section>
        <h3>Margin Auto</h3>
        <p>In CSS, margin: auto; is used to automatically calculate margins to center elements horizontally within their parent containers or to absorb leftover space.</p>
    </section>
    
</body>
</html>
