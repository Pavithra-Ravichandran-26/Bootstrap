<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Card</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            margin: 30px auto;
            border: 1px solid #ccc;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            background-color: white;
            text-align: center;
        }

        
        button {
            padding: 10px 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Chocolate Cake</h2>
        <p>Fresh homemade chocolate cake with rich chocolate flavor.</p>
        <button>Order Now</button>
    </div>

</body>
</html>
</body>
</html>
