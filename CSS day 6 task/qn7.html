<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box sizing foe Nested element</title>
    <style>
        .container{
            width: 500px;
            height: 150px;
            padding: 35px;
            border: 5px solid black;
            background-color: aqua;
        }
        .box{
            width: 400px;
            height: 100px;
            padding: 20px;
            border: 3px solid black;
            background-color: aquamarine;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Nested elements in HTML occur when you place one HTML element inside another element to structure web content correctly.
        </div>
    </div>
    
</body>
</html>
