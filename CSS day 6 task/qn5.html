<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin to create Space</title>
    <style>
        article{
            border: 2px solid black;
            padding: 10px;
            margin-bottom: 50px;
            background-color: beige;
            color: black;
        }
    </style>
</head>
<body>
    <article>
        <h1>Margin bottom</h1>
        <p>To create space between two article elements, apply the margin-bottom property to the first element</p>
    </article>
    <article>
        <h1>Margin top</h1>
        <p>To create space between two article elements, apply the margin-bottom property to the first element or the margin-top property to the second element.</p>
    </article>
    
</body>
</html>
