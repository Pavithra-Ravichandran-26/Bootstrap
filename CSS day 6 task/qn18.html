<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Box </title>
    <style>
        .box {
            width: 300px;
            padding: 30px;
            border: 2px solid blue;
            box-sizing: content-box;
            background-color: lightyellow;
            margin: 20px;
        }
    </style>
</head>
<body>

    <div class="box">
        content-box is the default box-sizing value in CSS. It means an element's specified width and height apply only to the inner content area. Any added padding or borders are then added on top of those dimensions, increasing the element's total size.
    </div>

</body>
</html>
</body>
</html>
