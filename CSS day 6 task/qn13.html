<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box horizontal and Vertical</title>
    <style>
        header ol{
            width: 300px;
            height: 150px;
            background-color: aquamarine;
            color: black;
            border: 2px solid black;

            display: flex;
            justify-content: center;
            align-items: center;

        }
    </style>
</head>
<body>
    <header>
        <ol>
            <li>display: flex: Turns the parent element into a flex container.</li>
            <li>justify-content: center: Aligns child items along the main axis (horizontally by default).</li>
            <li>align-items: center: Aligns child items along the cross axis (vertically by default).</li>
        </ol>
    </header>
    
</body>
</html>
