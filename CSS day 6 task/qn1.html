<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content box</title>
    <style>
        .box{
            width: 200px;
            height: 150px;
            border: 10px solid black;
            padding:10px;
            background-color:lightpink;
            color: black;
        }
    </style>
</head>
<body>
    <div class="box">
        A content box is the core inner part of an HTML element where text and images appear, and it is also the default value for the CSS box-sizing property where specified widths and heights apply only to that inner content area.
    </div>
    
</body>
</html>
