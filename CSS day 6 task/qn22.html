<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Layout</title>
    <style>
        article {
            border: 2px solid gray;
            padding: 15px;
            margin-bottom: 20px;
            background-color: lightyellow;
        }
    </style>
</head>
<body>

    <article>
        <h2>Margin Bottom</h2>
        <p>In CSS, margin-bottom sets the vertical space below an element.</p>
    </article>

    <article>
        <h2>Margin Top</h2>
        <p>The margin-top property in CSS sets the clear area (margin) required on the top of an element.</p>
    </article>

    <article>
        <h2>Margin </h2>
        <p>The margin-left property in CSS sets the extra space required on the left side of an element.</p>
    </article>

</body>
</html>
</body>
</html>
