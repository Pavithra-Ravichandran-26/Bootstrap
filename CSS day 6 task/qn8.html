<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background color and padding</title>
    <style>
        div{
            width: 200px;
            border: 2px solid black;
            padding: 20px;
            background-color: azure;
            color: blue;
        }
    </style>
</head>
<body>
    <div>
        CSS padding creates space inside an element, between its content and its border
    </div>
    
</body>
</html>
