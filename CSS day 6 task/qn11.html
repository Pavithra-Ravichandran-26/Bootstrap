<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Padding</title>
    <style>
        .box1{
            width: 300px;
            padding: 10px;
            margin: 20px;
            background-color: antiquewhite;
            color: black;
            border: 2px solid black;
            box-sizing: border-box;
        }
        .box2{
            width:300px;
            padding: 30px;
            background-color: antiquewhite;
            border: 2px solid black;
            color: black;
            box-sizing: border-box;
            margin: 20px;
        }

    </style>
</head>
<body>
    <div class="box1">
        padding = 10px
    </div>
    <div class="box2">
        we are using border box property to show the element identical, though the padding is different.
    </div>
</body>
</html>
