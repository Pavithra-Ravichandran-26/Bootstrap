<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Div using Flexbox</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightgray;
        }

        .box{
            width: 250px;
            padding: 20px;
            background-color: lightblue;
            border: 2px solid blue;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>vertically and horizontally inside the viewport</h2>
        <p>To center an element both vertically and horizontally inside the viewport, use CSS Flexbox </p>
    </div>

</body>
</html>
</body>
</html>
