<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Padding</title>
    <style>
        button{
            border: 2px solid black;
            padding: 10px 20px;
            background-color: purple;
            color: black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button>Click Me</button>
    
</body>
</html>
