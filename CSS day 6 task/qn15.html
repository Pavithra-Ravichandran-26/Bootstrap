<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Padding</title>
    <style>
        nav {
            border: 2px solid black;
            padding: 30px;
            background-color: aliceblue;
          }
          a{
            color: black;
            text-decoration: none;
            margin-right: 20px;
          }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    
</body>
</html>
