<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nth child</title>
    <style>
        tr:nth-child(odd){
            background-color: gray;
        }
            
    </style>
</head>
<body>
    <table border="3">
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Pavithra</td>
            <td>27</td>
        </tr>
        <tr>
            <td>Vignesh</td>
            <td>32</td>
        </tr>
        <tr>
            <td>Pranav Aditya</td>
            <td>3</td>
        </tr>
        
    </table>


    
</body>
</html>
