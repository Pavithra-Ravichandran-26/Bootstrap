<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Selector</title>
    <style>
        h1,h2,h3{
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>
    <h1>CSS Selectors</h1>
    <ol type="A">
        <li>Universal Selector</li>
        <li>Element Selector</li>
        <li>Class Selector</li>
        <li>ID selector</li>
    </ol>
    <h2>Combinators</h2>
    <ol type="a">
        <li>Decendant selector</li>
        <li>Child Selctor</li>
        <li>Adjacent sibling selector</li>
    </ol>
    <h3>Pseudo Class</h3>
    <ol type="i">
        <li>hover</li>
        <li>nth child</li>
    </ol>
    
</body>
</html>
