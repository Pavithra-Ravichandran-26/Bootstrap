<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> pseudo-elements </title>
    <style>
        h1::before{
            content:"★";
            color: gold;
        }
    </style>
</head>
<body>
    <h1>HTML</h1>
    <p>Hypertext Markup Language</p>
    <h1>CSS</h1>
    <p>Cascading Style Sheets</p>
    <h1>JS</h1>
    <p>Javascript</p>
    
</body>
</html>
