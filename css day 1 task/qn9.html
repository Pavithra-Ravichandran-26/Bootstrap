<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjacent Sibling</title>
    <style>
        h1+p{
            color: red;
            font-size: medium;
        }
    </style>
</head>
<body>
    <h1>Types Of colours in CSS</h1>
    <p>There are 4 types of Colours used in CSS</p>
    <p>
        <ol>
            <li>Named colours</li>
            <li>Hexadecimal Colours</li>
            <li>rgb and rgba colours</li>
            <li>hsl and hsla colours </li>
        </ol>
    </p>
    
</body>
</html>
