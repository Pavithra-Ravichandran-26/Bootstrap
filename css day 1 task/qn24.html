<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nth child even</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>Pavithra</td>
            <td>27</td>
        </tr>

        <tr>
            <td>vignesh</td>
            <td>32</td>
        </tr>

        <tr>
            <td>Pranav Aditya</td>
            <td>3</td>
        </tr>
    </table>

</body>
</html>
    
</body>
</html>
