<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibling selector</title>
    <style>
        h2 ~p{
            font-style: oblique;
        }
    </style>
</head>
<body>
    <h2>HTML</h2>
    <p>Hypertext markup language</p>
    <p>It is used to create structure for webpage</p>
    <div>
        <p>It has so many tags</p>
    </div>
    
</body>
</html>
