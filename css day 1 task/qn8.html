<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Selector</title>
    <style>
        ul> li{
            color: green;
            font-size: medium;
        }
    </style>
</head>
<body>
    <h1>AI Phython Fullstack</h1>
    <p>Frontend Language
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Javascript</li>
            <p>Backend Language</p>
            <ol>
                <li>Phython</li>
                <li>Java</li>
                <li>MySQL</li>
            </ol>
        </ul>
    </p>
    
</body>
</html>
