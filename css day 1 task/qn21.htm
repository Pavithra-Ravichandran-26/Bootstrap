<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Child selector </title>
    <style>
        section >p{
            color: darkgreen;
        }
    </style>
</head>
<body>
    <section>
        <p>HTML</p>
        <div>
            <p>Hypertext markup language</p>
        </div>
    </section>
    
</body>
</html>
