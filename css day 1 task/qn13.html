<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo-elements after</title>
    <style>
        .completed::after{
            content:"Done";
            color: green;
        }
    </style>
</head>
<body>
    <ol> 
        <li class="completed">HTML</li>
        <li class="completed">CSS</li>
        <li>Javascript</li>
    </ol>
    
</body>
</html>
