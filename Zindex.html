<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>
      .box1{
        width: 150px;
        height: 150px;
        background-color: red;
        position: fixed;
        top: 50px;
        left: 50px;
        z-index: -2;
      }
      .box2{
        width: 150px;
        height: 150px;
        background-color: green;
        position: fixed;
        top: 90px;
        left: 90px;
        z-index: -1;
      }

    </style>
</head>
<body>
    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
    
</body>
</html>
