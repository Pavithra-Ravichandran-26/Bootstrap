<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-decoration: line-through</title>
    <style>
        span {
            text-decoration: line-through;
        }
    </style>
</head>
<body>

    <p><p>The price of this item is <span>₹999</span> ₹500.</p></p>

</body>
</html>
</body>
</html>
