<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Family Example</title>
    <style>
        h1, h2 {
            font-family: Georgia, serif;
        }
    </style>
</head>
<body>

    <h1>HTML</h1>
    <p>Hypertext markup language</p>
    <h2>CSS</h2>
    <p>cascading style sheet</p>

</body>
</html>
</body>
</html>
