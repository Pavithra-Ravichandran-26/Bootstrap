<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Weight</title>
    <style>
        .light-text {
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="light-text">
        <h2>Font weight</h2>
        <p>The CSS font-weight property controls the boldness or thickness of characters in your text.</p>
    </div>

</body>
</html> 
</body>
</html>
