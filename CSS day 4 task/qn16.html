<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transform Lowercase</title>
    <style>
        div {
            text-transform: lowercase;
            font-size: 20px;
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div>
        WELCOME TO CSS STYLING!
    </div>

</body>
</html>
    
</body>
</html>
