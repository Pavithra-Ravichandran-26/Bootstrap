<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Family </title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Font Family</h1>
    <p>The font-family property in CSS specifies the font for an HTML element. It holds a prioritized list of one or more font names, known as a font stack, separated by commas.</p>

</body>
</html>
</body>
</html>
