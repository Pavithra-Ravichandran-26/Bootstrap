<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallback Font </title>
    <style>
        div {
            font-family: Georgia, "Times New Roman";
        }
    </style>
</head>
<body>

    <div>
        In CSS, a fallback font is a backup font specified within the font-family property to ensure that text displays correctly if the primary custom web font fails to load or lacks specific characters.
    </div>

</body>
</html>
</body>
</html>
