<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width using Percentage</title>
    <style>
        section {
            width: 80%;
            background-color: lightblue;
            padding: 20px;
            border: 2px solid blue;
        }
    </style>
</head>
<body>

    <section>
        <h2>Container & Layout Units</h2>
        <p>
            <ol>
                <li>% (Percentage): Relative directly to the parent container's calculated dimension.</li>
                <li>  fr (Fractional): Represents a fraction of the remaining free space inside a CSS Grid or Flex container.</li>
        </ol>
    </p>
    </section>

</body>
</html>
</body>
</html>
