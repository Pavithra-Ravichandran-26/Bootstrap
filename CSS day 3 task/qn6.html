<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width using vw</title>
    <style>
        div {
            width: 50vw;
            height: 100px;
            background-color: lightgreen;
            border: 2px solid green;
        }
    </style>
</head>
<body>

    <div>In CSS, vw stands for "Viewport Width", which is a relative length unit equal to 1% of the total width of the browser's visible screen area (the viewport).</div>

</body>
</html>
</body>
</html>
