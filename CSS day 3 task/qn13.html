<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute and Relative Units</title>
    <style>
        .container {
            width: 80%;
            padding: 20px;
            background-color: lightblue;
            border: 2px solid blue;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Absolutr unit and Relative units</h2>
        <p>The absolute units have fixed sizes that look exactly the same regardless of screen size or user settings, while relative units scale dynamically because their size depends on another value like a parent element's font size or the screen width</p>
    </div>

</body>
</html>
</body>
</html>
