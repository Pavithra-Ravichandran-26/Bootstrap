<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using em, rem, and %</title>
    <style>
        .container {
            width: 80%;
            padding: 2rem;
            background-color: lightgreen;
            border: 2px solid green;
            margin: auto;
        }

        h2 {
            text-align: center;
        }

        p {
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>CSS Units</h2>
        <p>
            CSS units help create flexible and responsive web layouts.
            This example uses <strong>%</strong> for the container width,
            <strong>rem</strong> for padding, and <strong>em</strong> for
            the paragraph's font size.
        </p>
    </div>

</body>
</html>
</body>
</html>
