<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size using em</title>
    <style>
        div {
            font-size: 20px;
        }

        p {
            font-size: 1.5em;
        }
    </style>
</head>
<body>

    <div>
        <p>em: Relative to the font size of the element itself (or its parent element if used on font-size).</p>
    </div>

</body>
</html>
</body>
</html>
