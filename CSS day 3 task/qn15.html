<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width using cm</title>
    <style>
        div {
            width: 10cm;
            height: 3cm;
            background-color: lightgreen;
            border: 2px solid green;
        }
    </style>
</head>
<body>

    <div>
        In CSS, cm stands for centimeters, which is an absolute length unit. While 1cm represents a fixed size, its physical rendering varies depending on the output device.
    </div>

</body>
</html>
</body>
</html>
