<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding using vmax</title>
    <style>
        .container {
            padding: 3vmax;
            background-color: lightblue;
            border: 2px solid blue;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Vmax in Css</h2>
        <p>In CSS, vmax is a viewport-relative length unit that represents 1% of the viewport’s larger dimension (either the width or the height, whichever is bigger).</p>
    </div>

</body>
</html>
</body>
</html>
