<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image</title>
    <style>
        .container {
            width: 50%;
            border: 2px solid rgb(112, 13, 46);
            padding: 20px;
        }

        img {
            width: 100%;
            max-width: 400px;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="cake image.jpg" alt="cake">
    </div>

</body>
</html>
</body>
</html>
