<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Icon using vmax</title>
    <style>
        .icon {
            width: 100px;
            height: 100px;
            background-color:green;
            color: black;
            font-size: 40px;

            border-radius: 10vmax;

    <div class="icon">
        ★
    </div>

</body>
