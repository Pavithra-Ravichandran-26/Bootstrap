<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size using rem</title>
    <style>
        html {
            font-size: 16px;
        }

        h1 {
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <h1>rem</h1>
    <p>rem (Root Em): Relative to the font size of the root (html) element.</p>

</body>
</html>
</body>
</html>
