<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Height using em</title>
    <style>
        p {
            font-size: 20px;
            line-height: 1.5em;
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <p>
        Line height is a CSS property that controls the vertical spacing between lines of text
    </p>

</body>
</html>
</body>
</html>
