<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button using rem and em</title>
    <style>
        button {
            font-size: 1.2em;
            padding: 1rem 2rem;
            background-color: skyblue;
            color:black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color:navy;
            color: white;
        }
    </style>
</head>
<body>

    <button>Click Me</button>

</body>
</html>
</body>
</html>
