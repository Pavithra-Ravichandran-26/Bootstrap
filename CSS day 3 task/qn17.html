<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size using em</title>
    <style>
        .container {
            font-size: 20px;
            border: 2px solid black;
            padding: 10px;
        }

        .container p {
            font-size: 1.5em;
        }
    </style>
</head>
<body>

    <div class="container">
        <p>When you apply em to a font-size property, the context is the font size of its closest parent element.Scenario: A parent  has a font-size of 20px. You want the child paragraph to have a text size of 30px.
        </p>
    </div>

</body>
</html>
</body>
</html>
