<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalable Text using vmin</title>
    <style>
        h1 {
            font-size: 5vmin;
            text-align: center;
            color: blue;
        }
    </style>
</head>
<body>

    <h1>In CSS, vmin stands for "Viewport Minimum" and represents 1% of the browser viewport's smaller dimension (either its width or height). </h1>

</body>
</html>
</body>
</html>
