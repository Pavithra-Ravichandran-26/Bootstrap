<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Height using %</title>
    <style>
        .container {
            width: 300px;
            height: 200px;
            border: 2px solid black;
        }

        .container img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="cake image.jpg" alt:cake image>
    </div>

</body>
</html> 
</body>
</html>
