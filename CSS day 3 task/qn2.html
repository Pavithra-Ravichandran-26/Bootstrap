<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin using cm</title>
    <style>
        p {
            margin: 2cm;
        }
    </style>
</head>
<body>
    <h1>CSS Units</h1>
     <p>CSS units are divided into two main categories: absolute units, which are fixed and independent of any other element, and relative units, which scale dynamically based on font sizes, viewports, or parent containers.</p>

</body>
</html>
</body>
</html>
