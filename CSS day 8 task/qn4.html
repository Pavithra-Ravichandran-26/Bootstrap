<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Flex Reorder</title>
     <style>
        .container {
            width: 500px;
            display: flex;
            border: 2px solid black;
            gap: 10px;
        }

        .box{
            width: 300px;
            padding: 20px;
            color: white;
            text-align: center;
            font-size: 20px;
        }

        .box1 {
            background-color: red;
            order: 2;
        }

        .box2 {
            background-color: green;
            order: 3;
        }

        .box3 {
            background-color: blue;
            order: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
    </div>
</body>
</html>
