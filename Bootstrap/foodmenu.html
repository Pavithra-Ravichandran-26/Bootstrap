<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center text-primary">Food Menu</h1>
        <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-12">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTY_OvyIU-bYODsU_KE4b5BUkzTOPx-AohpSIfmVQlXDEq8Yot_OmgCbewW&s=10"
                alt="pizza"
                width="100px"
                height="100px">
                <div class="card-body ">
                <h5 class="card-title text-success">Pizza</h5>
                <p class="card-text text-dark">Rs: 350</p>
                <button class="btn btn-primary">Order Now</button>
                </div>
              </div>

              <div class="col-lg-4 col-md-6 col-sm-12">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8pdyJvncE4Vp0ibSw5KgcfO9Ourj4O-SKY0nFCRcWnASGqWPiVoQMp8M&s=10"
                alt="burger"
                width="100px"
                height="100px">
                <div class="card-body ">
                <h5 class="card-title text-success">Burger</h5>
                <p class="card-text text-dark">Rs: 350</p>
                <button class="btn btn-primary">Order Now</button>
                </div>
               </div>
                
                <div class="col-lg-4 col-md-6 col-sm-12">
                <img src="https://images.themodernproper.com/production/posts/2022/Homemade-French-Fries_8.jpg?w=960&h=960&q=82&fm=jpg&fit=crop&dm=1662474181&s=50bccc38a736ef0e0a6e261ad23378f4"
                alt="fries"
                width="100px"
                height="100px">
                <div class="card-body ">
                <h5 class="card-title text-success">French Fries</h5>
                <p class="card-text text-dark">Rs:150</p>
                <button class="btn btn-primary">Order Now</button>
                </div>
                </div>

                <div class="col-lg-4 col-md-6 col-sm-12">
                <img src="https://static.toiimg.com/thumb/53222328.cms?imgsize=217320&width=800&height=800"
                alt="nuggets"
                width="100px"
                height="100px">
                <div class="card-body ">
                <h5 class="card-title text-success">Nuggets</h5>
                <p class="card-text text-dark">Rs:150</p>
                <button class="btn btn-primary">Order Now</button>
                </div>
                </div>

                <div class="col-lg-4 col-md-6 col-sm-12">
                <img src="https://i.ytimg.com/vi/8A-O9T2hzqI/maxresdefault.jpg"
                alt="smile"
                width="100px"
                height="100px">
                <div class="card-body ">
                <h5 class="card-title text-success">Potato Smile</h5>
                <p class="card-text text-dark">Rs:150</p>
                <button class="btn btn-primary">Order Now</button>
                </div>
                </div>

                <div class="col-lg-4 col-md-6 col-sm-12">
                <img src="https://png.pngtree.com/png-clipart/20240327/original/pngtree-delicious-fruit-juices-png-image_14692089.png"
                alt="juice"
                width="100px"
                height="100px">
                <div class="card-body ">
                <h5 class="card-title text-success">Fresh Juice</h5>
                <p class="card-text text-dark">Rs:100</p>
                <button class="btn btn-primary">Order Now</button>
                </div>
                </div>


        </div>
    </div>
    
</body>
</html>
