<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        header{
            background-color:#0077cc;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            margin-top:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        main{
            flex:1;
            padding:40px;
            text-align:center;
        }

        h2{
            margin-bottom:20px;
        }

        p{
            margin-bottom:25px;
        }

        button{
            padding:10px 20px;
            font-size:16px;
            background-color:#0077cc;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background-color:#005fa3;
        }

        footer{
            background-color:#333;
            color:white;
            text-align:center;
            padding:15px;
            position:sticky;
            bottom:0;
        }
    </style>

</head>
<body>

    <header>
        <h1>My Landing Page</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Welcome to Our Website</h2>

        <p>
            Discover our amazing services and explore everything we have to
            offer. Join us today and experience the difference.
        </p>

        <button>Get Started</button>
    </main>

    <footer>
        <p>&copy; 2026 My Landing Page | All Rights Reserved.</p>
    </footer>

</body>
</html>

</html>
