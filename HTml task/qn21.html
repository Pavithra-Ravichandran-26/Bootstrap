<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive YouTube Video</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f4f4;
            margin:0;
            padding:20px;
            text-align:center;
        }

        h1{
            color:#333;
        }

        .video-container{
            position:relative;
            width:100%;
            max-width:800px;
            margin:auto;
            padding-bottom:56.25%; /* 16:9 Aspect Ratio */
            height:0;
            overflow:hidden;
        }

        .video-container iframe{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            border:0;
        }
    </style>

</head>
<body>

    <h1>HTML Tutorial</h1>

    <div class="video-container">
        <iframe
            src="https://www.youtube.com/embed/qz0aGYrrlhU"
            title="YouTube Video"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
</html>
