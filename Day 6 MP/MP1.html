<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple card layout</title>
    <style>
        .card{
            width: 300px;
            margin: 20px;
            padding: 20px;
            border: 2px solid brown;
            text-align: center;

        }
        .card img{
            width: 200px;
            height: 200px;
            margin: 10px;
            padding: 10px;
            border: 2px solid lightgoldenrodyellow;
        }
        
    </style>
</head>
<body>
    <div class="card">
        <h2>Responsive Card</h2>
        <img src="https://cdn-efohi.nitrocdn.com/nzhjCTbLRQsVpZZpEWBzEjrDSwxMfKMK/assets/images/optimized/rev-7085c4a/yummycake.in/wp-content/uploads/2014/08/Chocolate-Butterscotch-Cake-1.jpg" alt="Butterscotch cake">
        <h4>Butterscotch Cake</h4>
        <p>Freshly Homemade Cake With Homemade Butterscothch sauce and parline.</p>
        <button>Order Now</button>
    </div>
    
</body>
</html>
