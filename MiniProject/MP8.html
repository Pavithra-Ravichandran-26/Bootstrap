<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Gallery</title>
</head>
<body>
    <h1>Image:Figure Caption</h1>
    <img src="cake image.jpg" alt="cake" width="30" height="30">
    <figurecaption>Vannila cake</figurecaption>
    <br><br>
    <h2>Audio player</h2>
    <audio controls>
        <source src="cake.mp3" type="audio/mp3">
    </audio>
     <br><br>
     <h3>embedded video</h3>
     <video width="560" controls>
        <source src="videomp4" type="video/mp4">
     </video>
             <iframe width="560" height="315" src="https://www.youtube.com/embed/SLFsRBXrl2c?si=20h-lb2i9tvxal9E" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


</body>
</html>
